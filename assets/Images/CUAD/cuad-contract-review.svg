<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">CUAD contract-review pipeline</title>
  <desc id="desc">Contract clauses from CUAD are classified by a transformer model. Explainable rules assign low, medium, or high risk tiers. This Accenture-sponsored team project is in progress.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#abb2bf" opacity=".14"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8da3bf" stroke-width="1.2"/></marker>
  </defs>
  <rect width="600" height="360" fill="#202630"/>
  <rect width="600" height="360" fill="url(#grid)"/>
  <g font-family="Consolas,monospace">
    <text x="30" y="39" font-size="22" fill="#c778dd">04 / CONTRACT REVIEW</text>
    <path d="M30 59H570" stroke="#485365"/>
    <text x="30" y="88" font-size="15" fill="#abb2bf">Accenture-sponsored · Break Through Tech AI Studio</text>
    <g fill="#232935" stroke="#c778dd" stroke-width="2">
      <rect x="30" y="115" width="150" height="72" rx="3"/>
      <rect x="225" y="115" width="150" height="72" rx="3"/>
      <rect x="420" y="115" width="150" height="72" rx="3"/>
    </g>
    <g fill="#dce3ef" font-size="18" text-anchor="middle">
      <text x="105" y="145">CUAD</text><text x="105" y="171" font-size="14">Contract clauses</text>
      <text x="300" y="145">Transformer</text><text x="300" y="171" font-size="14">Multi-label model</text>
      <text x="495" y="145">Clause labels</text><text x="495" y="171" font-size="14">Risk-scoring rules</text>
    </g>
    <g fill="none" stroke="#8da3bf" stroke-width="2.5" marker-end="url(#arrow)"><path d="M180 151H223"/><path d="M375 151H418"/><path d="M495 187V220H302V235"/></g>
    <rect x="145" y="239" width="310" height="62" rx="3" fill="#232935" stroke="#87b6c7" stroke-width="2"/>
    <text x="300" y="265" font-size="18" fill="#dce3ef" text-anchor="middle">Explainable risk tiers</text>
    <text x="300" y="289" font-size="17" fill="#87b6c7" text-anchor="middle">Low / Medium / High</text>
    <text x="30" y="336" font-size="15" fill="#abb2bf">TEAM PROJECT / IN PROGRESS</text>
  </g>
</svg>
